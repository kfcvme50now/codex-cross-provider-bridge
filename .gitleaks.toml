[extend]
useDefault = true

[allowlist]
description = "Generated bytecode is excluded from publication; check_publication rejects tracked runtime artifacts"
paths = ['''(?:^|[\\/])__pycache__[\\/]''']

[[rules]]
id = "private-user-directory"
description = "Private user home paths must not be published"
regex = '''(?i)(?:[A-Z]:[\\/]+Users[\\/]+[A-Za-z0-9_.-]+|/(?:Users|home)/[A-Za-z0-9_.-]+|[A-Z]:[\\/]+home[\\/]+[A-Za-z0-9_.-]+)'''
