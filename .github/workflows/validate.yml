name: Validate public version
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_publication.py
      - name: Windows configuration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-CodexBridgeConfig.ps1
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1 and verify checksum
        shell: bash
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location "$base/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan public tree and Git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml .
